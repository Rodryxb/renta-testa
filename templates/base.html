<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/media/mi_logo.ico" type="image/x-icon">
    <title>Renta Testa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: 'rgba(230, 195, 0, 0.85)',
                        brandBlack: '#222222',
                        brandMetallic: '#8a8d8f'
                    }
                }
            }
        }
    </script>
    <style>
        .nav-link { position: relative; }
        .nav-link::after {
            content: ''; position: absolute; width: 0; height: 2px;
            bottom: -4px; left: 0; background-color: rgba(230, 195, 0, 0.85);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }
        
        .metallic-text {
            background: linear-gradient(90deg, #555 0%, #8a8d8f 50%, #555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        .toast { background-color: #222; color: #fff; padding: 15px 25px; border-radius: 8px; margin-top: 10px; border-left: 5px solid rgba(230, 195, 0, 0.85); box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transform: translateX(100%); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body class="bg-white text-brandBlack flex flex-col min-h-screen">
    
    <nav class="bg-brandBlack text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center space-x-8">
                    <a href="/" class="flex-shrink-0 flex items-center gap-2">
                        <i class="fa-solid fa-truck-monster text-brandYellow text-3xl"></i>
                        <span class="font-bold text-2xl tracking-wider metallic-text">Renta Testa</span>
                    </a>
                    
                    <div class="hidden md:flex space-x-6 items-center pt-1">
                        <a href="/" class="nav-link text-gray-300 hover:text-white transition font-medium">Inicio</a>
                        <a href="/maquinas/" class="nav-link text-gray-300 hover:text-white transition font-medium">Máquinas</a>
                        <a href="/materiales/" class="nav-link text-gray-300 hover:text-white transition font-medium">Materiales</a>
                        <a href="/servicios/" class="nav-link text-gray-300 hover:text-white transition font-medium">Servicios Técnicos</a>
                        <a href="/devoluciones/" class="nav-link text-gray-300 hover:text-brandYellow transition font-medium bg-gray-800 px-3 py-1 rounded-md border border-gray-600 shadow-sm"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Devolución</a>
                    </div>
                </div>
                
                <div class="flex items-center" id="user-menu-container">
                    <a href="/auth/" id="btn-login-nav" class="flex items-center gap-2 bg-brandYellow text-brandBlack px-5 py-2 rounded-md font-bold hover:bg-yellow-400 transition transform hover:scale-105 shadow-md">
                        <i class="fa-solid fa-user"></i> Mi cuenta
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div id="toast-container"></div>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-brandBlack text-gray-400 py-6 text-center border-t border-brandMetallic mt-12">
        <div class="max-w-7xl mx-auto px-4">
            <p class="mb-2"><span class="text-brandYellow font-bold">Renta Testa</span> &copy; 2026. Todos los derechos reservados.</p>
            <p class="text-sm">Evaluación Backend/Frontend | Alumno: <span class="text-white">Rodrigo Bastian Castro Sandoval</span> | Sección: <span class="text-white">AP-N4-C1</span> | Año: <span class="text-white">2026</span></p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            const rol = localStorage.getItem('user_rol');
            const container = document.getElementById('user-menu-container');
            
            if (token) {
                let adminBtn = '';
                if(rol === 'EJECUTIVO') {
                    adminBtn = `<a href="/dashboard/" class="text-brandYellow font-bold mr-4 hover:underline"><i class="fa-solid fa-hammer"></i> Admin Panel</a>`;
                }

                
                const userEmail = localStorage.getItem('user_email') || '';
                const emailDisplay = userEmail ? `<span class="text-xs text-gray-400 font-normal ml-1">(${userEmail})</span>` : '';
                
                container.innerHTML = `
                    ${adminBtn}
                    <a href="/carro/" class="text-white hover:text-brandYellow transition font-medium mr-6 relative group" title="Mi Carrito">
                        <i class="fa-solid fa-cart-shopping text-2xl"></i>
                        <span id="global-cart-badge" class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-brandBlack shadow hidden">0</span>
                    </a>
                    
                    <div class="relative group cursor-pointer mr-2" onclick="toggleUserMenu()">
                        <div class="flex items-center gap-2 text-white hover:text-brandYellow transition font-medium">
                            <span class="font-bold flex items-center">Mi cuenta ${emailDisplay}</span>
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                        
                        <!-- Dropdown Menu -->
                        <div id="dropdown-user-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-xl border border-gray-200 hidden z-50">
                            <div class="py-1">
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 font-bold border-b"><i class="fa-solid fa-user-circle mr-2"></i> Mi Perfil</a>
                                <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-bold"><i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Cerrar Sesión</button>
                            </div>
                        </div>
                    </div>
                    
                    <img src="https://cdn-icons-png.flaticon.com/512/4205/4205906.png" class="w-10 h-10 rounded-full border-2 border-brandYellow bg-white object-cover shadow-lg" alt="User">
                `;

                // Fetch global cart count
                fetch('/api/carro-arriendo/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(res => res.json()).then(data => {
                    const badge = document.getElementById('global-cart-badge');
                    if(data.items && data.items.length > 0) {
                        badge.innerText = data.items.length;
                        badge.classList.remove('hidden');
                    }
                }).catch(err => console.error("Error cargando carrito:", err));

            }
        });

        function toggleUserMenu() {
            document.getElementById('dropdown-user-menu').classList.toggle('hidden');
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_rol');
            window.location.href = '/';
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-check-circle text-brandYellow mr-2"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3000);
        }

        function requireLogin() {
            if(!localStorage.getItem('access_token')) {
                alert('Debes iniciar sesión en tu cuenta para cotizar y comprar.');
                window.location.href = '/auth/';
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
