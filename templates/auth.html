{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
    
    <!-- Pestañas -->
    <div class="flex border-b-2 border-gray-200 mb-6">
        <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-3 text-center font-bold text-brandBlack border-b-4 border-brandYellow transition">Iniciar Sesión</button>
        <button id="tab-register" onclick="switchTab('register')" class="w-1/2 py-3 text-center font-medium text-gray-500 border-b-4 border-transparent transition">Regístrate Ahora</button>
    </div>

    <!-- Formulario Login -->
    <div id="form-login" class="block">
        <h2 class="text-2xl font-bold mb-6 text-center">Bienvenido a Renta Testa</h2>
        <div id="expired-msg" class="hidden bg-orange-100 text-orange-700 p-3 rounded mb-4 text-sm font-bold border-l-4 border-orange-500"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Tu sesión ha expirado por inactividad. Por favor, vuelve a iniciar sesión.</div>
        <div id="login-error" class="hidden bg-red-100 text-red-600 p-3 rounded mb-4 text-sm font-medium"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-brandYellow">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-brandYellow">
            </div>
            <button type="submit" class="w-full bg-brandBlack text-brandYellow font-bold py-3 rounded-md hover:bg-gray-900 transition shadow-lg">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Iniciar Sesión
            </button>
        </form>
    </div>

    <!-- Formulario Registro -->
    <div id="form-register" class="hidden">
        <h2 class="text-xl font-bold mb-4 text-center">Crea tu Cuenta Empresa</h2>
        <div id="register-msg" class="hidden p-3 rounded mb-4 text-sm font-medium"></div>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">Nombre Completo / Razón Social</label>
                <input type="text" id="reg-nombre" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-brandYellow text-sm">
            </div>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="reg-email" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-brandYellow text-sm">
            </div>
            <div class="flex gap-3 mb-3">
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Teléfono</label>
                    <input type="text" id="reg-telefono" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-brandYellow text-sm">
                </div>
                <div class="w-1/2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">Ciudad</label>
                    <input type="text" id="reg-ciudad" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-brandYellow text-sm">
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="reg-password" onkeyup="checkPasswordStrength()" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-brandYellow text-sm">
                <p id="pwd-hint" class="text-[10px] mt-1 text-red-500 font-medium">Sugerencia: Usa más de 8 caracteres, números y mayúsculas.</p>
            </div>
            <div class="mb-4 flex items-start mt-4">
                <input type="checkbox" id="reg-terms" required class="mt-1 mr-2 text-brandYellow focus:ring-brandYellow rounded">
                <label for="reg-terms" class="text-xs text-gray-600">Acepto los <span class="font-bold text-brandBlack underline cursor-pointer" title="Al registrarse, usted acepta la responsabilidad total sobre el cuidado y mantenimiento preventivo de las maquinarias arrendadas. En caso de daños, la garantía será utilizada.">Términos y Condiciones del Servicio de Arriendo de Renta Testa.</span></label>
            </div>
            <button type="submit" class="w-full bg-brandYellow text-brandBlack font-bold py-3 rounded-md hover:bg-yellow-400 transition shadow-lg">
                Registrarse
            </button>
        </form>
    </div>
</div>

<script>
    function switchTab(tab) {
        if(tab === 'login') {
            document.getElementById('form-login').classList.remove('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('tab-login').className = "w-1/2 py-3 text-center font-bold text-brandBlack border-b-4 border-brandYellow transition";
            document.getElementById('tab-register').className = "w-1/2 py-3 text-center font-medium text-gray-500 border-b-4 border-transparent transition";
        } else {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.remove('hidden');
            document.getElementById('tab-login').className = "w-1/2 py-3 text-center font-medium text-gray-500 border-b-4 border-transparent transition";
            document.getElementById('tab-register').className = "w-1/2 py-3 text-center font-bold text-brandBlack border-b-4 border-brandYellow transition";
        }
    }

    function checkPasswordStrength() {
        const pwd = document.getElementById('reg-password').value;
        const hint = document.getElementById('pwd-hint');
        if(pwd.length === 0) { hint.innerText = "Sugerencia: Usa más de 8 caracteres, números y mayúsculas."; hint.className = "text-[10px] mt-1 text-red-500"; return; }
        if(pwd.length >= 8 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) {
            hint.innerText = "¡Contraseña Segura!";
            hint.className = "text-[10px] mt-1 text-green-600 font-bold";
        } else {
            hint.innerText = "Seguridad Media/Baja: Agrega mayúsculas, números y 8+ caracteres.";
            hint.className = "text-[10px] mt-1 text-yellow-600 font-medium";
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errDiv = document.getElementById('login-error');
        
        try {
            const response = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: email, password: password })
            });
            const data = await response.json();
            
            if(response.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('user_rol', data.rol);
                localStorage.setItem('user_email', email);
                if(data.rol === 'EJECUTIVO') {
                    window.location.href = '/dashboard/';
                } else {
                    window.location.href = '/';
                }
            } else {
                errDiv.innerText = "Credenciales incorrectas.";
                errDiv.classList.remove('hidden');
            }
        } catch(err) {
            console.error(err);
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const msgDiv = document.getElementById('register-msg');
        const payload = {
            nombre: document.getElementById('reg-nombre').value,
            email: document.getElementById('reg-email').value,
            telefono: document.getElementById('reg-telefono').value,
            ciudad: document.getElementById('reg-ciudad').value,
            password: document.getElementById('reg-password').value
        };

        try {
            const response = await fetch('/api/auth/registro/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if(response.ok) {
                msgDiv.innerText = "¡Registro exitoso! Ahora puedes iniciar sesión.";
                msgDiv.className = "bg-green-100 text-green-700 p-3 rounded mb-4 text-sm font-medium";
                msgDiv.classList.remove('hidden');
                document.getElementById('registerForm').reset();
                setTimeout(() => switchTab('login'), 2000);
            } else {
                msgDiv.innerText = data.error || "Error al registrar.";
                msgDiv.className = "bg-red-100 text-red-600 p-3 rounded mb-4 text-sm font-medium";
                msgDiv.classList.remove('hidden');
            }
        } catch(err) {
            console.error(err);
        }
    }
</script>
{% endblock %}
