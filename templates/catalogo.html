{% extends 'base.html' %}
{% block content %}
<div class="max-w-[95%] mx-auto px-4 py-10">
    <h2 class="text-4xl font-extrabold text-brandBlack mb-2">{{ titulo }}</h2>
    <p class="text-gray-500 mb-10 text-lg">{{ subtitulo }}</p>

    
    <div class="flex flex-col md:flex-row gap-8">
        <!-- Sidebar Filtros -->
        <div class="w-full md:w-1/4 lg:w-1/5 bg-white p-5 rounded-xl border border-gray-100 shadow-sm h-max sticky top-24">
            <h3 class="font-bold text-brandBlack border-b pb-2 mb-4"><i class="fa-solid fa-filter text-brandYellow mr-2"></i> Filtros</h3>
            
            {% if tipo == 'MAQUINARIA' %}
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Precio Máx Diario:</label>
                <div class="font-black text-lg text-brandBlack mb-2" id="price-val-txt">$3,500,000 CLP</div>
                <input type="range" id="filter-price" min="50000" max="3500000" step="10000" value="3500000" class="w-full accent-brandYellow" oninput="updateFilters()">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Capacidad</label>
                <div class="flex flex-col gap-2">
                    <label class="flex items-center group">
                        <input type="checkbox" class="cap-checkbox w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" value="BAJA" onchange="updateFilters()">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-brandBlack transition">Baja (Menos de 20 t)</span>
                    </label>
                    <label class="flex items-center group">
                        <input type="checkbox" class="cap-checkbox w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" value="MEDIA" onchange="updateFilters()">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-brandBlack transition">Media (20 t - 150 t)</span>
                    </label>
                    <label class="flex items-center group">
                        <input type="checkbox" class="cap-checkbox w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" value="ALTA" onchange="updateFilters()">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-brandBlack transition">Alta (Más de 150 t)</span>
                    </label>
                    <label class="flex items-center group">
                        <input type="checkbox" class="cap-checkbox w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" value="OTRAS" onchange="updateFilters()">
                        <span class="ml-3 text-sm text-gray-700 group-hover:text-brandBlack transition">Otras capacidades</span>
                    </label>
                </div>
            </div>
            <div>
                <label class="flex items-center group">
                    <input type="checkbox" id="filter-stock" class="w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" onchange="updateFilters()">
                    <span class="ml-3 text-sm font-bold text-gray-700 group-hover:text-brandBlack transition">Equipos disponibles</span>
                </label>
            </div>
            
            {% elif tipo == 'MATERIAL' %}
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Precio Máx Unitario:</label>
                <div class="font-black text-lg text-brandBlack mb-2" id="price-val-txt">$50,000 CLP</div>
                <input type="range" id="filter-price-mat" min="1000" max="50000" step="500" value="50000" class="w-full accent-brandYellow" oninput="updateFilters()">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Formato de Venta</label>
                <label class="flex items-center group">
                    <input type="checkbox" id="filter-sacos" class="w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" onchange="updateFilters()">
                    <span class="ml-3 text-sm text-gray-700 group-hover:text-brandBlack transition">Solo en Sacos / Bolsas</span>
                </label>
            </div>
            <div>
                <label class="flex items-center group">
                    <input type="checkbox" id="filter-stock-mat" class="w-5 h-5 text-brandYellow rounded border-gray-300 focus:ring-brandYellow cursor-pointer transition" onchange="updateFilters()">
                    <span class="ml-3 text-sm font-bold text-gray-700 group-hover:text-brandBlack transition">Materiales disponibles</span>
                </label>
            </div>
            {% endif %}
        </div>

        <!-- Grid Contenedor -->
        <div class="w-full md:w-3/4 lg:w-4/5">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="catalog-grid">

        <!-- JS inyecta las cards aquí -->
    </div>
</div>

<!-- Modal Cotizador (Maquinaria) -->

<script>
    // Se inyecta la variable {{ tipo }} desde Django ('MAQUINARIA' o 'MATERIAL')
    const apiTipo = "{{ tipo }}"; 

    document.addEventListener('DOMContentLoaded', loadCatalog);

    
    let allItems = [];
    const isMat = "{{ tipo }}" === "MATERIAL";

    document.addEventListener('DOMContentLoaded', () => {
        loadCatalog();
    });

    async function loadCatalog() {
        // Al agregar ?tipo={{ tipo }}, garantizamos que el backend devuelva 
        // EXCLUSIVAMENTE los items que corresponden a la seccion (Maquinaria o Material)
        let url = '/api/maquinarias/?tipo={{ tipo }}';
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            
            allItems = data;
            renderGrid(allItems);
        } catch (e) {
            console.error("Error cargando el catalogo:", e);
        }
    }

    function updateFilters() {
        if(isMat) {
            const priceVal = document.getElementById('filter-price-mat').value;
            document.getElementById('price-val-txt').innerText = '$' + parseInt(priceVal).toLocaleString('en-US') + ' CLP';
            const stockOnly = document.getElementById('filter-stock-mat').checked;
            const soloSacos = document.getElementById('filter-sacos').checked;
            
            const filtered = allItems.filter(item => {
                if (parseFloat(item.tarifa_diaria) > parseInt(priceVal)) return false;
                if (stockOnly && item.stock_disponible <= 0) return false;
                if (soloSacos) {
                    const desc = (item.descripcion_detallada || "").toLowerCase();
                    const title = (item.nombre || "").toLowerCase();
                    if (!desc.includes('saco') && !title.includes('saco') && !desc.includes('bolsa') && !title.includes('bolsa')) {
                        return false;
                    }
                }
                return true;
            });
            renderGrid(filtered);
            
        } else {
            const priceVal = document.getElementById('filter-price').value;
            document.getElementById('price-val-txt').innerText = '$' + parseInt(priceVal).toLocaleString('en-US') + ' CLP';
            const stockOnly = document.getElementById('filter-stock').checked;
            const checkedCaps = Array.from(document.querySelectorAll('.cap-checkbox:checked')).map(cb => cb.value);
            
            const filtered = allItems.filter(item => {
                if (parseFloat(item.tarifa_diaria) > parseInt(priceVal)) return false;
                if (stockOnly && item.stock_disponible <= 0) return false;
                if (checkedCaps.length > 0) {
                    let capValue = "OTRAS";
                    const desc = (item.descripcion_detallada || "").toLowerCase();
                    const title = (item.nombre || "").toLowerCase();
                    const fullText = title + " " + desc;
                    const match = fullText.match(/(\d+(?:\.\d+)?)\s*toneladas?/i);
                    if (match) {
                        const tons = parseFloat(match[1]);
                        if (tons < 20) capValue = "BAJA";
                        else if (tons >= 20 && tons <= 150) capValue = "MEDIA";
                        else capValue = "ALTA";
                    }
                    if(!checkedCaps.includes(capValue)) return false;
                }
                return true;
            });
            renderGrid(filtered);
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('catalog-grid');
        grid.innerHTML = '';
        
        if (data.length === 0) {
            grid.innerHTML = '<p class="col-span-full text-gray-500 text-center py-10 font-bold text-xl"><i class="fa-solid fa-ghost mr-2 text-3xl mb-3 block"></i> No hay productos que coincidan con los filtros.</p>';
            return;
        }

        data.forEach(item => {
            const isMat = "{{ tipo }}" === 'MATERIAL';
            const outOfStock = item.stock_disponible <= 0;
            const imgUrl = (item.imagen_final || item.imagen_url) || 'https://via.placeholder.com/400x300?text=Sin+Imagen';
            const btnText = outOfStock ? 'Sin Stock' : (isMat ? 'Comprar / Añadir' : 'Cotizar Arriendo');
            const clickFn = `window.location.href='/producto/${item.id}/'`;

            const div = document.createElement('div');
            div.className = "bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden hover:shadow-2xl transition transform hover:-translate-y-1 flex flex-col fade-in";
            if(outOfStock) div.classList.add('opacity-70');
            
            div.innerHTML = `
                <div class="h-48 bg-white flex items-center justify-center overflow-hidden border-b p-4 relative cursor-pointer" onclick="${clickFn}">
                    ${isMat ? '<span class="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded shadow z-10">Venta Directa</span>' : '<span class="absolute top-3 left-3 bg-brandYellow text-brandBlack text-xs font-bold px-2 py-1 rounded shadow z-10">Arriendo</span>'}
                    <img src="${imgUrl}" alt="${item.nombre}" class="max-h-full object-contain group-hover:scale-110 transition duration-500">
                </div>
                <div class="p-5 flex flex-col flex-grow">
                    <h3 class="text-lg font-bold text-brandBlack mb-1 cursor-pointer hover:text-brandYellow" onclick="${clickFn}">${item.nombre}</h3>
                    <p class="text-gray-500 text-xs mb-3 uppercase tracking-wider">${item.categoria}</p>
                    
                    <div class="mt-auto">
                        <p class="text-sm text-gray-500 mb-1">Stock Disponible: <span class="font-bold ${item.stock_disponible > 0 ? 'text-green-600' : 'text-red-500'}">${item.stock_disponible} unid.</span></p>
                        <p class="text-lg font-extrabold text-brandBlack mb-4">$${parseInt(item.tarifa_diaria).toLocaleString('en-US')} CLP ${isMat ? '/ unid.' : '/ día'}</p>
                        <button onclick="${clickFn}" class="w-full bg-brandBlack text-brandYellow font-bold py-2 rounded-lg hover:bg-gray-900 transition shadow ${outOfStock ? 'cursor-not-allowed bg-gray-300 text-gray-500' : ''}" ${outOfStock ? 'disabled' : ''}>
                            ${btnText}
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    </script>
{% endblock %}
